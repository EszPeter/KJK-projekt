<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js"></script>
    <title>Document</title>
    <style>
        body { font-family: sans-serif;
             background-color: #1a1a1a;
              color: #f0f0f0;
               padding: 20px; 
               display: flex; 
               justify-content: center; }
        .game-container { max-width: 700px;
             width: 100%;
              background-color: #262626;
               padding: 30px;
                border-radius: 8px;
                 box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ff4500;
             text-align: center; }
        .stats-panel { background-color: #1f1f1f;
             padding: 15px;
              border-radius: 5px;
               margin-bottom: 25px;
                border-left: 4px solid #ff4500; }
        .story-section { font-size: 12pt;
             line-height: 1.6;
              margin-bottom: 30px;
               background-color: #2d2d2d;
                padding: 20px;
                 border-radius: 5px; }
        .choice-btn { display: block;
             width: 100%;
            background-color: #3e3e3e;
             color: white;
              border: 1px solid #555;
               padding: 12px 15px;
                margin-bottom: 10px;
                 border-radius: 4px;
                  text-align: left;
                   cursor: pointer; }
        .choice-btn:hover { background-color: #ff4500; }
        .restart-btn { background-color: #8b0000;
             text-align: center;
              font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">
    <h1>A Tűzhegy Varázslója</h1>
    <div class="stats-panel">
        <strong>⚔️ KARAKTERLAP</strong><br>
        Életerő: <span id="hp-display">20</span> / 20<br>
        Hátizsák: <span id="inventory-display">Kard, Élelem</span>
    </div>
    <div class="story-section">
        <div id="chapter-id" style="font-weight:bold; color:#ff4500; margin-bottom:10px;"></div>
        <div id="story-text">Kaland betöltése...</div>
    </div>
    <div id="choices-container"></div>
    </div>
</body>
</html>
